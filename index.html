
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Pop ★</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <header class="top-bar">
            <div>
                <h1>Calculator<span> ★</span></h1>
                
            </div>

            <button id="theme-toggle" class="theme-button"
                    aria-label="Switch color theme">
                ☾
            </button>
        </header>

        <section class="calculator">

            <div class="screen">
                <p class="screen-label">YOUR CALCULATION</p>

                <div id="previous"></div>

                <input
                    type="text"
                    id="display"
                    value="0"
                    readonly
                    aria-label="Calculator result"
                >
            </div>

            <div class="buttons">

                <button class="utility" data-action="clear">AC</button>
                <button class="utility" data-action="delete">DEL</button>
                <button class="utility" data-action="percent">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button class="zero" data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equals" data-action="calculate">=</button>

            </div>
        </section>

        <section class="history-section">
            <div class="history-heading">
                <h2>recent calculations</h2>
                <button id="clear-history">clear</button>
            </div>

            <ul id="history-list">
                <li class="empty-history">Your calculations will appear here </li>
            </ul>
        </section>

        
    </main>

    <script src="script.js"></script>
</body>
</html>
